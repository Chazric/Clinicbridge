services:
  - type: web
    name: clinicbridge-billing
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: LICENCE_SIGNING_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
